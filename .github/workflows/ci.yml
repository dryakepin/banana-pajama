name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: api (tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix api
      - run: npm test --prefix api
      - run: npm run lint --prefix api

  client:
    name: client (tests + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix client
      - run: npm test --prefix client
      - run: npm run lint --prefix client
      # The build is part of CI because the client tests stub Phaser out
      # entirely (see client/test/stubs/phaser.js). A green suite therefore
      # does not prove the bundle still compiles against the real engine.
      - run: npm run build --prefix client

  server:
    name: server (migration integration + lint)
    runs-on: ubuntu-latest

    # Locally these tests are skipped unless TEST_DATABASE_URL is set, so that
    # `npm test` never requires Docker. CI is where they always run.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix server
      - run: npm test --prefix server
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpw@localhost:5432/postgres?sslmode=disable
      - run: npm run lint --prefix server

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scan walks every commit reachable from HEAD, so a
          # secret added and then "removed" in a later commit is still caught.
          fetch-depth: 0

      # Pinned to an exact version and checksum-verified. Downloading an
      # unpinned binary and running it over the whole repo would be a
      # supply-chain hole in the middle of a security control.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict
          tar -xzf "$ARCHIVE" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Runs the self-test first. Stock gitleaks does not detect the Supabase
      # connection string that leaked in SEC-1, so this repo adds its own rule;
      # the self-test fails the build if that rule ever stops firing.
      - run: ./scripts/scan-secrets.sh
