services:
  # PostgreSQL Database
  # Note: This service is only needed for local Docker development
  # When using Supabase or external database, omit this service
  # Use profile 'local-db' to start only when needed
  database:
    profiles:
      - local-db
    image: postgres:15-alpine
    container_name: banana_pajama_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: banana_pajama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-banana_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banana_pajama"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - banana_pajama_network

  # API server -- runs the same api/ handlers that Vercel deploys.
  #
  # ARCH-1: this used to build server/, a second complete Express backend. That
  # is gone. scripts/dev-api-server.js is an adapter over the api/*.js handler
  # modules, so there is one implementation of every endpoint.
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: banana_pajama_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      # Deliberately a literal, not ${DATABASE_URL:-...}. The review noted that
      # the old setup was "one exported variable away" from a developer's shell
      # DATABASE_URL silently pointing the local stack at production. Hard-coding
      # the local service removes that entirely: `docker compose` cannot be
      # redirected at production by the surrounding environment.
      #
      # sslmode=disable because api/lib/db.js requests verified TLS for any
      # non-Supabase host, and the local postgres container serves plaintext.
      DATABASE_URL: postgresql://postgres:banana_dev_password@database:5432/banana_pajama?sslmode=disable
    ports:
      - "3000:3000"
    # required: false is load-bearing. `database` sits behind the local-db
    # profile, so without the profile it is not part of the project at all and
    # an unconditional depends_on makes compose reject the whole file:
    #   service "api" depends on undefined service "database"
    # That broke every compose command, profile or not. With required: false
    # the dependency still gates startup when the profile IS active, and is
    # ignored when it is not. See INFRA-1.
    depends_on:
      database:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - banana_pajama_network

  # Phaser.js Game Client (Development)
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: banana_pajama_client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - banana_pajama_network

  # Development Tools (optional)
  # Note: Adminer requires local database service
  adminer:
    profiles:
      - local-db
    image: adminer:latest
    container_name: banana_pajama_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      database:
        condition: service_healthy
    networks:
      - banana_pajama_network

volumes:
  postgres_data:
    driver: local

networks:
  banana_pajama_network:
    driver: bridge
    name: banana_pajama_network